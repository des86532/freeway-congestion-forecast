[project]
name = "freeway-congestion-forecast"
version = "0.1.0"
description = "國道壅塞預測與系統最佳分流 MVP"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
fcf = "fcf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
